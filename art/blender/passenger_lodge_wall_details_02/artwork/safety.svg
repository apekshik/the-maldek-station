<rect x="0" y="0" width="1280" height="1780" fill="#eee5cc"/>
<rect x="0" y="0" width="1280" height="270" fill="#254d43"/>
<text x="75" y="55" dominant-baseline="text-before-edge" text-anchor="start" font-family="Arial" font-weight="700" font-size="61" fill="#eee5cc">SHARE THE MOUNTAIN</text>
<text x="75" y="150" dominant-baseline="text-before-edge" text-anchor="start" font-family="Georgia" font-weight="400" font-size="41" fill="#eee5cc">A little care goes a long way</text>
<circle cx="150" cy="430" r="83" fill="#c99542"/>
<text x="295" y="355" dominant-baseline="text-before-edge" text-anchor="start" font-family="Arial" font-weight="700" font-size="40" fill="#254d43">LOOK AHEAD</text>
<text x="295" y="445" dominant-baseline="text-before-edge" text-anchor="start" font-family="Arial" font-weight="400" font-size="38" fill="#283833">Give others room.</text>
<text x="295" y="512" dominant-baseline="text-before-edge" text-anchor="start" font-family="Arial" font-weight="400" font-size="38" fill="#283833">Check before setting off.</text>
<circle cx="136" cy="400" r="10" fill="#eee5cc"/>
<polyline points="136,415 154,440 180,450" fill="none" stroke="#eee5cc" stroke-width="8" stroke-linejoin="round"/>
<polyline points="112,466 190,477" fill="none" stroke="#eee5cc" stroke-width="5" stroke-linejoin="round"/>
<polyline points="75,668 1205,668" fill="none" stroke="#c3c1a5" stroke-width="2" stroke-linejoin="round"/>
<circle cx="150" cy="850" r="83" fill="#c99542"/>
<text x="295" y="775" dominant-baseline="text-before-edge" text-anchor="start" font-family="Arial" font-weight="700" font-size="40" fill="#254d43">TAKE YOUR TIME</text>
<text x="295" y="865" dominant-baseline="text-before-edge" text-anchor="start" font-family="Arial" font-weight="400" font-size="38" fill="#283833">Choose a comfortable pace.</text>
<text x="295" y="932" dominant-baseline="text-before-edge" text-anchor="start" font-family="Arial" font-weight="400" font-size="38" fill="#283833">Rest clear of the route.</text>
<polyline points="90,884 125,829 145,859 170,816 210,884" fill="none" stroke="#eee5cc" stroke-width="5" stroke-linejoin="round"/>
<polyline points="75,1088 1205,1088" fill="none" stroke="#c3c1a5" stroke-width="2" stroke-linejoin="round"/>
<circle cx="150" cy="1270" r="83" fill="#c99542"/>
<text x="295" y="1195" dominant-baseline="text-before-edge" text-anchor="start" font-family="Arial" font-weight="700" font-size="40" fill="#254d43">LEAVE IT AS YOU FOUND IT</text>
<text x="295" y="1285" dominant-baseline="text-before-edge" text-anchor="start" font-family="Arial" font-weight="400" font-size="38" fill="#283833">Take litter back with you.</text>
<text x="295" y="1352" dominant-baseline="text-before-edge" text-anchor="start" font-family="Arial" font-weight="400" font-size="38" fill="#283833">Respect the mountain.</text>
<polyline points="125,1237 133,1308 177,1308 184,1237 125,1237" fill="none" stroke="#eee5cc" stroke-width="5" stroke-linejoin="round"/>
<polyline points="75,1508 1205,1508" fill="none" stroke="#c3c1a5" stroke-width="2" stroke-linejoin="round"/>
