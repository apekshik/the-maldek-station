<text x="55" y="235" dominant-baseline="text-before-edge" text-anchor="start" font-family="Georgia" font-weight="400" font-size="36" fill="#283833">A gentle local outing.</text>
<text x="55" y="335" dominant-baseline="text-before-edge" text-anchor="start" font-family="Georgia" font-weight="400" font-size="36" fill="#283833">Meet at the lodge.</text>
<text x="55" y="435" dominant-baseline="text-before-edge" text-anchor="start" font-family="Georgia" font-weight="400" font-size="36" fill="#283833">Ask for details</text>
<text x="55" y="535" dominant-baseline="text-before-edge" text-anchor="start" font-family="Georgia" font-weight="400" font-size="36" fill="#283833">at the coffee hatch.</text>
